version: '3.8'

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: code_everyday
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - SECRET_KEY=${SECRET_KEY}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - FLASK_ENV=production
    volumes:
      - app_data:/app/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  app_data:
